[project]
name = "beatgrid-lab"
version = "0.0.0"
description = "Research workspace for beatgrid: references, metrics and the reference pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beat-this>=1.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "soxr>=0.5",
    "torch",
    "torchaudio",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
lab = "beatgrid_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "safetensors>=0.4"]
perf = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beatgrid_lab"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
