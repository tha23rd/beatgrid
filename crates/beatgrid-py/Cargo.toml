[package]
name = "beatgrid-py"
description = "Python bindings for beatgrid"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
# Built and published as a Python wheel with maturin, not on crates.io.
publish = false

[lib]
name = "_beatgrid"
crate-type = ["cdylib"]

[dependencies]
beatgrid = { path = "../beatgrid" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
rayon = "1"
